# DataLens GHCR Publication
# Contract version: datalens_ci_publish_v0.1

name: DataLens Image Publish


on:

  workflow_call:


permissions:
  contents: read
  packages: write


concurrency:
  group: datalens-publish-${{ github.ref }}
  cancel-in-progress: false


env:
  REGISTRY: ghcr.io

  API_IMAGE: >-
    ghcr.io/${{ github.repository_owner }}/datalens-api

  WEB_IMAGE: >-
    ghcr.io/${{ github.repository_owner }}/datalens-web


jobs:

  publish:

    name: Publish Runtime Images

    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/chore/organize-artifact-store-wiring'

    runs-on: ubuntu-latest

    timeout-minutes: 35


    steps:

      # ------------------------------------------------------
      # REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ------------------------------------------------------
      # BUILDX
      # ------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ------------------------------------------------------
      # GHCR AUTHENTICATION
      # ------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}


      # ------------------------------------------------------
      # RELEASE CHANNEL
      # ------------------------------------------------------

      - name: Resolve publication channel
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          then
            channel="latest"

          elif [[ \
            "${GITHUB_REF}" \
            == \
            "refs/heads/chore/organize-artifact-store-wiring" \
          ]]
          then
            channel="integration"

          else
            echo \
              "::error::Ref is not authorized for GHCR publication."

            exit 1
          fi

          short_sha="${GITHUB_SHA::12}"

          {
            echo "channel=${channel}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          echo "Channel=${channel}"
          echo "SHA=${short_sha}"


      # ------------------------------------------------------
      # API METADATA
      # ------------------------------------------------------

      - name: Generate API image metadata
        id: api_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}

          tags: |
            type=raw,value=${{ steps.release.outputs.channel }}
            type=raw,value=sha-${{ steps.release.outputs.short_sha }}

          labels: |
            org.opencontainers.image.title=DataLens API
            org.opencontainers.image.description=Local-first DataLens FastAPI runtime
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}


      # ------------------------------------------------------
      # API BUILD + PUSH
      # ------------------------------------------------------

      - name: Build and publish API image
        id: api_build
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile

          platforms: linux/amd64

          pull: true
          push: true

          tags: ${{ steps.api_metadata.outputs.tags }}
          labels: ${{ steps.api_metadata.outputs.labels }}


      # ------------------------------------------------------
      # WEB METADATA
      # ------------------------------------------------------

      - name: Generate Web image metadata
        id: web_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}

          tags: |
            type=raw,value=${{ steps.release.outputs.channel }}
            type=raw,value=sha-${{ steps.release.outputs.short_sha }}

          labels: |
            org.opencontainers.image.title=DataLens Web
            org.opencontainers.image.description=DataLens Next.js standalone runtime
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}


      # ------------------------------------------------------
      # WEB BUILD + PUSH
      # ------------------------------------------------------

      - name: Build and publish Web image
        id: web_build
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile

          platforms: linux/amd64

          pull: true
          push: true

          build-args: |
            NEXT_PUBLIC_DATALENS_API_URL=http://127.0.0.1:8000

          tags: ${{ steps.web_metadata.outputs.tags }}
          labels: ${{ steps.web_metadata.outputs.labels }}


      # ------------------------------------------------------
      # REGISTRY VERIFICATION
      # ------------------------------------------------------

      - name: Verify published manifests
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "API digest=${{ steps.api_build.outputs.digest }}"

          echo \
            "WEB digest=${{ steps.web_build.outputs.digest }}"

          docker buildx imagetools inspect \
            "${API_IMAGE}@${{ steps.api_build.outputs.digest }}" \
            > /dev/null

          docker buildx imagetools inspect \
            "${WEB_IMAGE}@${{ steps.web_build.outputs.digest }}" \
            > /dev/null

          echo \
            "[PASS] Published GHCR manifests are readable."


      # ------------------------------------------------------
      # JOB SUMMARY
      # ------------------------------------------------------

      - name: Write publication summary
        shell: bash
        run: |
          {
            echo "## DataLens GHCR publication"
            echo
            echo "- Channel: \`${{ steps.release.outputs.channel }}\`"
            echo "- SHA tag: \`sha-${{ steps.release.outputs.short_sha }}\`"
            echo "- API: \`${API_IMAGE}\`"
            echo "- Web: \`${WEB_IMAGE}\`"
            echo "- API digest: \`${{ steps.api_build.outputs.digest }}\`"
            echo "- Web digest: \`${{ steps.web_build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"